name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      placeholder: What you did, what you expected, what you saw.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The URL carries the selected preset and options.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 125, macOS
